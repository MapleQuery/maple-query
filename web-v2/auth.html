<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MapleQuery — Sign in</title>
  <meta name="description" content="Sign in to MapleQuery to ask Canada's open-government data in plain language and get clear, cited answers." />

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://api.fontshare.com" crossorigin />
  <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin />
  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@300,400,500,700,900&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&display=swap" rel="stylesheet" />

  <script>
    function tok(v){ return function(o){ o=o||{}; return "rgb(var(--"+v+") / "+(o.opacityValue==null?1:o.opacityValue)+")"; }; }
    var T = ["canvas","paper","raised","ink","ink-soft","muted","faint","line","line-strong","accent","accent-press","ok","warn","graph-1","graph-2"];
    var colors = {}; T.forEach(function(t){ colors[t] = tok(t); });
    tailwind.config = { theme: { extend: {
      colors: colors,
      fontFamily: {
        display: ['Satoshi','system-ui','sans-serif'],
        sans: ['Satoshi','system-ui','sans-serif'],
        mono: ['"Fira Code"','ui-monospace','monospace']
      }
    } } };
  </script>

  <style>
    :root{
      --canvas:250 250 249; --paper:255 255 255; --raised:255 255 255;
      --ink:18 18 20; --ink-soft:58 58 64; --muted:116 116 124; --faint:158 158 166;
      --line:234 233 230; --line-strong:214 213 209;
      --accent:210 54 40; --accent-press:178 42 30;
      --ok:22 150 74; --warn:194 102 8; --graph-1:176 176 184; --graph-2:96 98 110;
      color-scheme:light;
    }
    [data-theme="dark"]{
      --canvas:11 11 12; --paper:20 20 22; --raised:27 27 31;
      --ink:244 244 242; --ink-soft:202 202 198; --muted:138 138 146; --faint:96 96 104;
      --line:40 40 45; --line-strong:56 56 63;
      --accent:240 84 68; --accent-press:255 108 92;
      --ok:52 190 100; --warn:226 140 44; --graph-1:84 84 94; --graph-2:190 190 200;
      color-scheme:dark;
    }
    *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    body{ margin:0; background:rgb(var(--canvas)); color:rgb(var(--ink-soft));
      font-family:Satoshi,system-ui,sans-serif; -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
      transition:background-color .3s ease, color .3s ease; }
    ::selection{ background:rgb(var(--accent) / .2); color:rgb(var(--ink)); }
    :focus{ outline:none; }
    :focus-visible{ outline:2px solid rgb(var(--accent)); outline-offset:2px; border-radius:10px; }
    a{ text-decoration:none; color:inherit; }

    .mono{ font-family:"Fira Code",ui-monospace,monospace; }
    .display{ font-family:Satoshi,system-ui,sans-serif; }

    /* ambient glow, matches landing */
    .glow{ background:
      radial-gradient(55% 50% at 82% -8%, rgb(var(--accent) / .12), transparent 60%),
      radial-gradient(45% 45% at 4% 6%, rgb(var(--graph-2) / .08), transparent 55%); }

    .field{ transition:border-color .2s ease, background-color .2s ease; }
    .field:focus-visible{ border-color:rgb(var(--accent)); outline:none; }

    .reveal{ opacity:0; transform:translateY(16px); transition:opacity .7s cubic-bezier(.16,1,.3,1), transform .7s cubic-bezier(.16,1,.3,1); }
    .reveal.in{ opacity:1; transform:none; }

    @media (prefers-reduced-motion: reduce){
      *{ animation:none !important; transition:none !important; }
      .reveal{ opacity:1 !important; transform:none !important; }
    }
  </style>
</head>
<body class="glow">

  <!-- ===================== TOP BAR ===================== -->
  <header class="mx-auto flex max-w-5xl items-center justify-between px-5 py-5 md:px-8">
    <a href="index.html" class="group inline-flex cursor-pointer items-center gap-2.5" aria-label="MapleQuery home">
      <span class="grid h-8 w-8 place-items-center rounded-lg bg-accent text-white">
        <svg viewBox="0 0 80 80" fill="none" style="height:18px;width:18px"><circle cx="34" cy="34" r="20" stroke="currentColor" stroke-width="5"/><line x1="48" y1="48" x2="66" y2="66" stroke="currentColor" stroke-width="6" stroke-linecap="round"/></svg>
      </span>
      <span class="display text-[17px] font-semibold tracking-tight text-ink">MapleQuery</span>
    </a>
    <button id="themeToggle" class="grid h-9 w-9 cursor-pointer place-items-center rounded-lg border border-line text-muted transition-colors hover:text-ink" aria-label="Toggle theme"><span id="themeIcon"></span></button>
  </header>

  <!-- ===================== AUTH CARD ===================== -->
  <main class="mx-auto flex min-h-[calc(100vh-160px)] max-w-md items-center px-5">
    <div class="reveal w-full">
      <div class="rounded-2xl border border-line bg-raised p-7 shadow-xl shadow-ink/5 md:p-8">
        <div class="text-center">
          <h1 class="display text-2xl font-bold tracking-tight text-ink">Welcome back</h1>
          <p class="mt-1.5 text-sm text-muted">Sign in to ask, cite, and publish from Canadian open data.</p>
        </div>

        <!-- OAuth -->
        <button type="button" data-go class="mt-7 flex w-full cursor-pointer items-center justify-center gap-2.5 rounded-xl border border-line-strong bg-raised px-4 py-2.5 text-sm font-medium text-ink transition-colors hover:border-accent/50 hover:bg-canvas">
          <svg viewBox="0 0 48 48" class="h-4 w-4" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
          Continue with Google
        </button>

        <!-- divider -->
        <div class="my-5 flex items-center gap-3">
          <span class="h-px flex-1 bg-line"></span>
          <span class="mono text-[10px] uppercase tracking-[0.16em] text-faint">or</span>
          <span class="h-px flex-1 bg-line"></span>
        </div>

        <!-- email + password -->
        <form id="signinForm" class="space-y-4" novalidate>
          <div>
            <label for="email" class="mb-1.5 block text-xs font-medium text-ink-soft">Email</label>
            <input id="email" name="email" type="email" autocomplete="email" required placeholder="you@example.ca"
              class="field w-full rounded-xl border border-line-strong bg-canvas px-3.5 py-2.5 text-sm text-ink placeholder:text-faint" />
          </div>
          <div>
            <div class="mb-1.5 flex items-center justify-between">
              <label for="password" class="block text-xs font-medium text-ink-soft">Password</label>
              <a href="#" class="cursor-pointer text-xs font-medium text-accent transition-colors hover:text-accent-press">Forgot?</a>
            </div>
            <div class="relative">
              <input id="password" name="password" type="password" autocomplete="current-password" required placeholder="••••••••"
                class="field w-full rounded-xl border border-line-strong bg-canvas px-3.5 py-2.5 pr-11 text-sm text-ink placeholder:text-faint" />
              <button id="pwToggle" type="button" aria-label="Show password" aria-pressed="false"
                class="absolute inset-y-0 right-0 grid w-10 cursor-pointer place-items-center text-muted transition-colors hover:text-ink">
                <span id="pwIcon"></span>
              </button>
            </div>
          </div>
          <label class="flex cursor-pointer select-none items-center gap-2 text-sm text-muted">
            <input type="checkbox" class="h-4 w-4 cursor-pointer rounded border-line-strong text-accent focus-visible:outline-none" />
            Keep me signed in
          </label>
          <button type="submit"
            class="w-full cursor-pointer rounded-xl bg-accent px-4 py-2.5 text-sm font-semibold text-white shadow-lg shadow-accent/20 transition-colors hover:bg-accent-press">
            Sign in
          </button>
        </form>

        <p class="mt-6 text-center text-sm text-muted">
          New to MapleQuery?
          <a href="#" class="cursor-pointer font-semibold text-accent transition-colors hover:text-accent-press">Create an account</a>
        </p>
      </div>

      <p class="mt-5 flex items-center justify-center gap-1.5 text-center text-xs text-faint">
        <svg viewBox="0 0 24 24" class="h-3.5 w-3.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        Prototype — this form is a UI mock and does not authenticate.
      </p>
    </div>
  </main>

  <script>
  (function(){
    var $ = function(s){ return document.querySelector(s); };

    /* theme (shares the landing page's stored preference) */
    function icon(dark){ return dark
      ? '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4m11.4-11.4 1.4-1.4"/></svg>'
      : '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>'; }
    function applyTheme(t){ document.documentElement.setAttribute("data-theme", t); try{ localStorage.setItem("mq-atlas-theme", t); }catch(e){} $("#themeIcon").innerHTML = icon(t==="dark"); }
    var saved=null; try{ saved=localStorage.getItem("mq-atlas-theme"); }catch(e){}
    applyTheme(saved || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));
    $("#themeToggle").addEventListener("click", function(){ applyTheme(document.documentElement.getAttribute("data-theme")==="dark"?"light":"dark"); });

    /* card reveal */
    var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    var card = $(".reveal");
    if(reduce){ card.classList.add("in"); } else { requestAnimationFrame(function(){ setTimeout(function(){ card.classList.add("in"); }, 60); }); }

    /* show / hide password */
    function eye(open){ return open
      ? '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>'
      : '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.9 4.24A9.1 9.1 0 0 1 12 4c6.5 0 10 7 10 7a13.2 13.2 0 0 1-2.16 3.19M6.6 6.6A13.2 13.2 0 0 0 2 11s3.5 7 10 7a9.1 9.1 0 0 0 4-.94"/><path d="m2 2 20 20"/></svg>'; }
    var pw = $("#password"), pwBtn = $("#pwToggle"), pwIcon = $("#pwIcon");
    pwIcon.innerHTML = eye(false);
    pwBtn.addEventListener("click", function(){
      var show = pw.type === "password"; pw.type = show ? "text" : "password";
      pwBtn.setAttribute("aria-pressed", String(show)); pwBtn.setAttribute("aria-label", show ? "Hide password" : "Show password");
      pwIcon.innerHTML = eye(show); pw.focus();
    });

    /* prototype: no real auth — credentials are never sent anywhere.
       simulate a successful sign-in by opening the app. */
    function go(){ window.location.href = "atlas/index.html"; }
    $("#signinForm").addEventListener("submit", function(e){ e.preventDefault(); go(); });
    Array.prototype.forEach.call(document.querySelectorAll("[data-go]"), function(b){ b.addEventListener("click", go); });
  })();
  </script>
</body>
</html>
