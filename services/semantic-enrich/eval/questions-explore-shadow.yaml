# Exploratory-question fixture for the descriptive-rubric shadow run.
#
# Purpose is act-flip precision data, not regression: these questions
# exercise the `explore` triage category and the descriptive verify
# rubric against the real corpus, so every unfit verdict can be read by
# eye before the rubric is allowed to alter an answer.
#
# Same schema as questions-agent-traces.yaml. Deliberately includes the
# boundary cases the category is most likely to get wrong (ex-06..ex-09,
# ex-13) plus two controls that must NOT route to explore - misrouting a
# figure request into a description is the costly direction.

- id: ex-01
  question: what's in the Supplementary Estimates?
  source: explore-shadow-2026-07-27
  expected:
    triage: explore
    outcome: explored
    packages_any_of: []
    must_caveat: false
  observed_v1:
    outcome: unmeasured
    note: canonical explore - names a dataset class, asks contents
